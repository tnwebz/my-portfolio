<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#09090b"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Background Glow Circle -->
  <circle cx="400" cy="225" r="180" fill="url(#grad1)" filter="blur(40px)"/>
  
  <!-- Card Mockup Container -->
  <rect x="200" y="100" width="400" height="250" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  
  <!-- Geometric Code / Project Icon -->
  <path d="M 370 205 L 340 225 L 370 245" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 430 205 L 460 225 L 430 245" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="415" y1="200" x2="385" y2="250" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Project Title Line -->
  <rect x="300" y="275" width="200" height="6" rx="3" fill="url(#glow)" opacity="0.8"/>
  <rect x="340" y="295" width="120" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
</svg>
